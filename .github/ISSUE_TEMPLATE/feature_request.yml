name: Feature Request
description: Suggest a feature or improvement for the BookOrbit Android app
title: "[Feature] "
labels: ["feature", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not the solution. What is hard or missing today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: How you imagine it working. Sketches and screenshots are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you use today (optional)

  - type: input
    id: app-version
    attributes:
      label: App version (optional)
      placeholder: "1.0.0 (1)"
