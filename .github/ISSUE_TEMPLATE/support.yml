name: Support
description: Ask a question or get help with setup, your server, or using the app
title: "[Support] "
labels: ["support", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not post passwords, access tokens, or private server addresses.
        For purchases, open BookOrbit Premium in the app and select Restore purchases first. Google Play handles billing and refunds.

  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
      description: Include any error message exactly as the app shows it.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?

  - type: input
    id: app-version
    attributes:
      label: App version
      description: The build shown under More > About in the app.
      placeholder: "1.0.0 (1)"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: "Pixel 9, Android 16"
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: BookOrbit server version
      description: If you run the server, the release or Docker image tag you use. Leave blank otherwise.
      placeholder: "3.0.0"
